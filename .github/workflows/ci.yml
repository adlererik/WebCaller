name: Source and containers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run audit:source
      - run: npm run verify:signal
      - run: npm run prepare:source
      - run: npm --prefix third_party/libsignal/oracle ci --ignore-scripts
      - run: npm run test:signal
      - run: bash -n deploy/install-debian.sh deploy/install-system.sh deploy/setup-turn-tls.sh
      - run: bash deploy/install-debian.sh --check
      - run: docker build -t webcaller-ci .
      - run: docker build -f deploy/Dockerfile.turn -t webcaller-turn-ci .
