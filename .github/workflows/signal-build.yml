name: Rebuild experimental libsignal browser module
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.98.1 install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci --ignore-scripts
      - run: npm run verify:signal
      - run: npm run build:signal
      - run: git diff --exit-code -- public/vendor/signal third_party/libsignal/binding/Cargo.lock
      - run: npm run verify:signal
      - run: npm --prefix third_party/libsignal/oracle ci --ignore-scripts
      - run: npm run test:signal
      - name: Retain experimental rebuild evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libsignal-browser-rebuild-${{ github.run_id }}
          path: public/vendor/signal/
          retention-days: 3
          if-no-files-found: error
